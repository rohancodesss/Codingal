<!DOCTYPE html>
<html>
    <body>
        <h2>JavaScript Array Methods</h2>
        <h2>join() and pop()</h2>
        <p> <h2> The join() method joins all elements of an array into a string.</h2></p>
        <p> <h2> The pop() method removes the last element from an array.</h2></p>
        <p id="myjoin"></p>
        <p id="myfirstpop"></p>
        <p id="mysecondpop"></p>
        <script>
            const fruits = ["Banana", "Orange", "Apple", "Mango"];
            document.getElementById("myjoin").innerHTML = fruits.join();
            document.getElementById("myfirstpop").innerHTML = fruits.pop()
            document.getElementById("mysecondpop").innerHTML = fruits.pop()


        </script>
    </body>
</html>
