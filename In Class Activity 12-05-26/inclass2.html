<!DOCTYPE html>
<html lang-"en">
<head>

<title>My Dream Room - CSS Float</title>
<style>

body {
font-family: Arial, sans-serif;
background-color: #fe2ed8;
padding: 30px;
margin: 0;
}



h1 {
text-align: center;
color: #3d7b1f;
margin-bottom: 20px;
}

.room {
width: 500px;
border: 4px solid #8d6e63;
padding: 16px;
margin: 0 auto;
background-color: #fff8f0;
overflow: hidden;
}
.bed {
    width: 160px;
background-color: #6d4c41;
color: white;
padding: 20px;
text-align: center;

float: left;
margin-right: 16px;
}
.rug {
background-color: orange;
color: white;
    padding: 14px;
    text-align: center;
    font-weight: bold;
    
    clear: both;
    margin-top: 16px;

}
.discription {
    color:aquamarine;
    font-size: 0.9em;
    line-height: 1.6;

}

.window {
    width: 100px;
    background-color: #3d7b1f;
    color: white;
    padding: 20px;
    text-align: center;
    float: right;
    margin-left: 16px;
}

</style>
</head>
<body>
    <h1>🏡 My dream room</h1>
    <div class="room">
      <div class="bed"> <br>Bed </div>
      <div class="window"><br>Window</div>
      <div class="discription">
        Welcome to my dream room! I love the way sunlight comes through my window every morning. My bed is supercozy with star pattern pillows

      </div>
      <div class="rug">Fluffy Orange Rug</div>
    </div>
</body>
</html>
