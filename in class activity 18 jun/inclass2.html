<!DOCTYPE html>
<html lang="en">
<head>
<title>javascript variables</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
    <h1>JavaScript Variables</h1>
    <p>Sum of two numbers</p>
    <p id="result"></p>
    <script>
        var num1=1
        var num2=2
        var sum=num1+num2
        document.getElementById("result").innerHTML = sum;
        
    </script>
</body>
</html>
