<html lang="en">
    <body>

        <p id="demo"></p>
        <p id="demo1"></p>
        <p id="demo2"></p>
    <script>
        var b = 5;
        function myFunction() {
            var a = 4;
            multiply = a * b;
            document.getElementById("demo").innerHTML = multiply
        } 
        var a = 2;
            document.getElementById("demo1").innerHTML = a
            document.getElementById("demo2") .innerHTML = b      



    </script>
    </body>
</html>
