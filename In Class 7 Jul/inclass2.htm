<!DOCTYPE html>
<html lang="en">
    <body>
        <h2> JavaScript for Loops </h2>
        <script>
             array = ["Apple", "Banana", "Mango", "Orange"];
             var str = "";
                for (var i = 0; i < array.length; i++) {
                    
                    str += array[i] + "<br>";
                }
                document.write(str);
        </script>
    </body>
</html>
